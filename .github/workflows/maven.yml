name: CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'liberica'
        cache: maven
    - name: Build with Maven
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: mvn -B verify sonar:sonar

  # Compatibility leg: the same reactor against the newest Spring Boot minor.
  # Catches Boot class relocations (silent ordering breaks, NoClassDefFoundError)
  # the day we bump this version, instead of when a user files an issue.
  # BootOrderingReferenceIntegrityTest turns silent mis-ordering into a red build here.
  boot-next:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'liberica'
        cache: maven
    - name: Build with Maven (Spring Boot next minor)
      run: mvn -B verify -Dspring-boot.version=4.1.0
