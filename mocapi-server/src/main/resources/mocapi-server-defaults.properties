mocapi.server-name=${spring.application.name:mocapi}
mocapi.server-title=Callibrity Mocapi MCP Server
mocapi.server-version=unknown
mocapi.allowed-origins=localhost,127.0.0.1,[::1]
# MRTR elicitation replay (ADR-0021): requestState token key and TTL. Empty secret means an
# ephemeral key is generated at startup (dev only — tokens die with the process).
mocapi.mrtr.secret=
mocapi.mrtr.ttl=PT5M
mocapi.pagination.page-size=50
mocapi.endpoint=/mcp
# Cache directives stamped onto the six cacheable results (ttlMs/cacheScope are required by the
# spec). list-ttl covers tools/prompts/resources/templates lists and server/discover; read-ttl
# covers resources/read. PT0S + private = "don't cache", the conservative default.
mocapi.cache.list-ttl=PT0S
mocapi.cache.read-ttl=PT0S
mocapi.cache.scope=private
