server.port=8083
spring.threads.virtual.enabled=true
spring.application.name=mocapi-example-tasks-redis
mocapi.server-name=mocapi-tasks-redis-example
mocapi.server-title=Mocapi Tasks Example (Redis-backed TaskStore, kill-and-resume)
logging.level.com.callibrity.mocapi=INFO

# Keep the compose-managed Redis running when the app stops, so task state survives an
# application restart — that is the whole point of this example (kill-and-resume).
spring.docker.compose.lifecycle-management=start-only
