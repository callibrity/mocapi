# Started automatically by Spring Boot's Docker Compose support when the app boots.
# lifecycle-management is set to start-only (application.properties), so this Redis —
# and the task state in it — deliberately outlives application restarts. Stop it
# yourself when done tinkering: docker compose -f examples/tasks-redis/compose.yaml down
services:
  redis:
    image: "redis:7-alpine"
    ports:
      - "6379"
